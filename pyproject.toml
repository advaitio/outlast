[project]
name = "outlast"
version = "0.1.0"
description = "A social game for giving broken household items one community repair attempt."
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.49,<2",
  "openai>=2.8,<3",
  "pydantic>=2.11,<3",
  "supabase>=2.18,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
